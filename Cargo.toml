[package]
name = "yp"
version = "0.11.2"
edition = "2024"
rust-version = "1.99.0"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
color_quant = "2.0.0"
crossbeam-queue = "0.3.14"
directories = "6.0.0"
futures = "0.3.32"
image = "0.25.10"
libc = "0.2.186"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
# Output device only: mpv decodes to raw PCM, so no decoder features are needed.
rodio = { version = "0.22", default-features = false, features = ["playback"] }
ron = "0.12.1"
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
whisper_cli = { git = "https://github.com/m1guelpf/whisper-cli-rs" }
